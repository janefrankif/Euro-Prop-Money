<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with dark slate fill -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#slateGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Cinema Film Perforations at corners / edges -->
  <rect x="7" y="7" width="4" height="6" rx="1" fill="#F59E0B" opacity="0.8" />
  <rect x="53" y="7" width="4" height="6" rx="1" fill="#F59E0B" opacity="0.8" />
  <rect x="7" y="51" width="4" height="6" rx="1" fill="#F59E0B" opacity="0.8" />
  <rect x="53" y="51" width="4" height="6" rx="1" fill="#F59E0B" opacity="0.8" />

  <!-- Golden Banknote Arch / Euro Symbol -->
  <path d="M 44 22 C 39 16 25 17 22 25 C 20 30 20 34 22 39 C 25 47 39 48 44 42" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Dual Euro Crossbars with Cinema Crop Mark Stylings -->
  <line x1="14" y1="29" x2="38" y2="29" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="14" y1="35" x2="38" y2="35" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Star Accent -->
  <polygon points="46,15 47.5,18.5 51,19 48.5,21.5 49,25 46,23 43,25 43.5,21.5 41,19 44.5,18.5" fill="#FCD34D" />
</svg>
