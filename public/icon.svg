<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B2332"/>
      <stop offset="50%" stop-color="#6E1824"/>
      <stop offset="100%" stop-color="#4A0D16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B2"/>
      <stop offset="35%" stop-color="#E2B766"/>
      <stop offset="70%" stop-color="#C7903E"/>
      <stop offset="100%" stop-color="#996820"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D49B44"/>
      <stop offset="100%" stop-color="#FFF3D6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Crossed Butcher Cleavers in Background of Crest -->
  <g opacity="0.25" stroke="url(#goldGrad)" stroke-width="6" fill="url(#goldGrad)">
    <!-- Cleaver 1 (Left to Right) -->
    <path d="M160 160 L240 240 L210 270 L130 190 Z" />
    <path d="M240 240 L350 350 L330 370 L220 260 Z" />
    <rect x="110" y="140" width="80" height="60" rx="6"/>
    
    <!-- Cleaver 2 (Right to Left) -->
    <path d="M352 160 L272 240 L302 270 L382 190 Z" />
    <path d="M272 240 L162 350 L182 370 L292 260 Z" />
    <rect x="322" y="140" width="80" height="60" rx="6"/>
  </g>

  <!-- Center Master Bull / Angus Steer Silhouette Symbol -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Horns & Crown -->
    <path d="M256 120 C280 120 340 128 376 172 C390 188 394 206 388 214 C382 222 366 216 354 202 C332 176 298 168 256 168 C214 168 180 176 158 202 C146 216 130 222 124 214 C118 206 122 188 136 172 C172 128 232 120 256 120 Z" />

    <!-- Forehead & Face Contour -->
    <path d="M256 160 C292 160 326 174 336 210 C344 240 334 274 322 308 C312 334 290 356 256 364 C222 356 200 334 190 308 C178 274 168 240 176 210 C186 174 220 160 256 160 Z" />

    <!-- Ears Left & Right -->
    <path d="M174 196 C144 190 120 196 112 208 C108 214 114 222 128 222 C148 222 168 212 174 196 Z" />
    <path d="M338 196 C368 190 392 196 400 208 C404 214 398 222 384 222 C364 222 344 212 338 196 Z" />

    <!-- Muzzle / Nose Ring -->
    <ellipse cx="256" cy="336" rx="42" ry="28" fill="#4A0D16" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Nostrils -->
    <circle cx="240" cy="334" r="5" fill="url(#goldGrad)"/>
    <circle cx="272" cy="334" r="5" fill="url(#goldGrad)"/>
    <!-- Brass Bull Ring -->
    <path d="M236 348 C236 366 244 380 256 380 C268 380 276 366 276 348" fill="none" stroke="url(#goldBright)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stars of Heritage / Australian Quality -->
  <g fill="url(#goldBright)">
    <polygon points="256,76 261,90 276,90 264,99 268,114 256,104 244,114 248,99 236,90 251,90" />
    <polygon points="206,88 210,98 222,98 212,105 215,117 206,109 197,117 200,105 190,98 202,98" transform="scale(0.85) translate(36, 18)" />
    <polygon points="306,88 310,98 322,98 312,105 315,117 306,109 297,117 300,105 290,98 302,98" transform="scale(0.85) translate(52, 18)" />
  </g>

  <!-- Bottom Arch Text: ARTISAN BUTCHER -->
  <text x="256" y="424" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="800" letter-spacing="7" fill="url(#goldGrad)">
    AUSTRALIA
  </text>
  <text x="256" y="448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#E2B766" opacity="0.9">
    EST. NSW 2642
  </text>
</svg>
